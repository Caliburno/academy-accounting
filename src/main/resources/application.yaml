spring:
  application:
    name: API for Academy Account
  datasource:
    url: jdbc:h2:file:./academy_accounting_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    root: INFO
    io.github.caliburno.academy_accounting: DEBUG