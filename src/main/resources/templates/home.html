<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Academy Accounting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container mt-4">
    <h1 class="mb-4"><i class="bi bi-speedometer2"></i> Dashboard</h1>

    <div class="row">
        <div class="col-md-3">
            <div class="card text-white bg-primary mb-3">
                <div class="card-body text-center">
                    <i class="bi bi-people fs-1"></i>
                    <h5 class="card-title mt-2">Students</h5>
                    <h2 th:text="${totalStudents}">0</h2>
                    <a href="/students" class="btn btn-light btn-sm mt-2">View All</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-success mb-3">
                <div class="card-body text-center">
                    <i class="bi bi-book fs-1"></i>
                    <h5 class="card-title mt-2">Courses</h5>
                    <h2 th:text="${totalCourses}">0</h2>
                    <a href="/courses" class="btn btn-light btn-sm mt-2">View All</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-info mb-3">
                <div class="card-body text-center">
                    <i class="bi bi-journal-check fs-1"></i>
                    <h5 class="card-title mt-2">Enrollments</h5>
                    <h2 th:text="${totalEnrollments}">0</h2>
                    <a href="/enrollments" class="btn btn-light btn-sm mt-2">View All</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-warning mb-3">
                <div class="card-body text-center">
                    <i class="bi bi-hourglass-split fs-1"></i>
                    <h5 class="card-title mt-2">Pending</h5>
                    <h2 th:text="${pendingPayments}">0</h2>
                    <a href="/payments/pending" class="btn btn-light btn-sm mt-2">View All</a>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-12">
            <div class="card border-danger">
                <div class="card-body text-center">
                    <i class="bi bi-exclamation-triangle-fill text-danger fs-1"></i>
                    <h5 class="card-title text-danger mt-2">Overdue Payments</h5>
                    <h2 th:text="${overduePayments}">0</h2>
                    <a href="/payments/overdue" class="btn btn-danger mt-2">View Details</a>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-12">
            <h3><i class="bi bi-lightning-charge"></i> Quick Actions</h3>
            <div class="d-grid gap-2 d-md-flex mt-3">
                <a href="/students/new" class="btn btn-primary"><i class="bi bi-person-plus"></i> New Student</a>
                <a href="/courses/new" class="btn btn-success"><i class="bi bi-plus-circle"></i> New Course</a>
                <a href="/enrollments/new" class="btn btn-info"><i class="bi bi-journal-plus"></i> New Enrollment</a>
                <a href="/reports" class="btn btn-secondary"><i class="bi bi-graph-up"></i> View Reports</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
