<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Enrollment - Academy Accounting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container mt-4">
    <h1><i class="bi bi-journal-plus"></i> New Enrollment</h1>

    <div class="card mt-4">
        <div class="card-body">
            <form action="/enrollments" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="studentId" class="form-label">Student *</label>
                        <select class="form-select" id="studentId" name="studentId" required>
                            <option value="">Select Student</option>
                            <option th:each="student : ${students}"
                                    th:value="${student.id}"
                                    th:text="${student.name}">
                                John Doe (Jane Doe)
                            </option>
                        </select>
                        <small class="text-muted">Family discounts will be applied automatically</small>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="courseId" class="form-label">Course *</label>
                        <select class="form-select" id="courseId" name="courseId" required>
                            <option value="">Select Course</option>
                            <option th:each="course : ${courses}"
                                    th:value="${course.id}"
                                    th:text="${course.name + ' - ' + course.level + ' ($' + course.basePrice + ')'}">
                                English 101 - BEGINNER ($100)
                            </option>
                        </select>
                    </div>
                </div>

                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i>
                    <strong>Note:</strong> Enrollment will automatically generate 10 monthly payments (March-December).
                    Family discounts will be applied if the student belongs to a family group with 2+ siblings.
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Enroll Student</button>
                    <a href="/enrollments" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
