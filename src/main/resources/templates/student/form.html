<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${student.id != null ? 'Edit Student' : 'New Student'}">Student Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container mt-4">
    <h1><i class="bi bi-person-plus"></i> <span th:text="${student.id != null ? 'Edit Student' : 'New Student'}">Student Form</span></h1>

    <div class="card mt-4">
        <div class="card-body">
            <form th:action="${student.id != null ? '/students/' + student.id : '/students'}" th:object="${student}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="name" class="form-label">Name *</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="text" class="form-control" id="phone" th:field="*{phone}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="dateOfBirth" class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="dateOfBirth" th:field="*{dateOfBirth}">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="referentAdult" class="form-label">Referent Adult</label>
                        <input type="text" class="form-control" id="referentAdult" th:field="*{referentAdult}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('referentAdult')}" th:errors="*{referentAdult}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="familyGroupId" class="form-label">Family Group (Optional)</label>
                        <select class="form-select" id="familyGroupId" name="familyGroupId">
                            <option value="">No Family Group</option>
                            <option th:each="fg : ${familyGroups}" th:value="${fg.id}" th:text="${fg.name}" th:selected="${student.familyGroup != null && student.familyGroup.id == fg.id}"></option>
                        </select>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
                    <a href="/students" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
