<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${course.id != null ? 'Edit Course' : 'New Course'}">Course Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container mt-4">
    <h1><i class="bi bi-plus-circle"></i> <span th:text="${course.id != null ? 'Edit Course' : 'New Course'}">Course Form</span></h1>

    <div class="card mt-4">
        <div class="card-body">
            <form th:action="${course.id != null ? '/courses/' + course.id : '/courses'}" th:object="${course}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="name" class="form-label">Course Name *</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="level" class="form-label">Level *</label>
                        <select class="form-select" id="level" th:field="*{level}" required>
                            <option value="">Select Level</option>
                            <option value="YEAR_OLDS_3">3 YEAR OLDS</option>
                            <option value="YEAR_OLDS_4">4 YEAR OLDS</option>
                            <option value="YEAR_OLDS_5">5 YEAR OLDS</option>
                            <option value="TRANSITION_1">TRANSITION 1</option>
                            <option value="TRANSITION_2">TRANSITION 2</option>
                            <option value="CHILDREN_1">CHILDREN 1</option>
                            <option value="CHILDREN_2">CHILDREN 2</option>
                            <option value="CHILDREN_3">CHILDREN 3</option>
                            <option value="JUNIOR_1">JUNIOR 1</option>
                            <option value="JUNIOR_2">JUNIOR 2</option>
                            <option value="JUNIOR_3">JUNIOR 3</option>
                            <option value="JUNIOR_4">JUNIOR 4</option>
                            <option value="JUNIOR_5">JUNIOR 5</option>
                            <option value="PRE_BASIC">PRE BASIC</option>PRE_BASIC
                            <option value="BASIC_CERTIFICATE_LEVEL">BASIC CERTIFICATE LEVEL</option>BASIC_CERTIFICATE_LEVEL
                            <option value="ADULTS_1">ADULTS 1</option>
                            <option value="ADULTS_2">ADULTS 2</option>
                            <option value="ADULTS_3">ADULTS 3</option>
                            <option value="ADULTS_4">ADULTS 4</option>
                            <option value="OXFORD_HOUSE_COLLEGE_PRELIMINARY">OXFORD HOUSE COLLEGE PRELIMINARY</option>
                        </select>
                        <div class="text-danger small" th:if="${#fields.hasErrors('level')}" th:errors="*{level}"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="basePrice" class="form-label">Monthly Price *</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" class="form-control" id="basePrice" th:field="*{basePrice}" required>
                        </div>
                        <div class="text-danger small" th:if="${#fields.hasErrors('basePrice')}" th:errors="*{basePrice}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="academicYearId" class="form-label">Academic Year</label>
                        <select class="form-select" id="academicYearId" name="academicYearId">
                            <option value="">Use Active Academic Year</option>
                            <option th:each="year : ${academicYears}"
                                    th:value="${year.id}"
                                    th:text="${year.year}"
                                    th:selected="${course.academicYear != null && course.academicYear.id == year.id}">
                            </option>
                        </select>
                        <small class="text-muted">Leave blank to use active academic year</small>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Save</button>
                    <a href="/courses" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
