<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academic Years - Academy Accounting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container mt-4">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1><i class="bi bi-calendar-range"></i> Academic Years</h1>
        <a href="/academic-years/new" class="btn btn-primary"><i class="bi bi-plus-circle"></i> New Academic Year</a>
    </div>

    <div class="alert alert-info">
        <i class="bi bi-info-circle"></i>
        <strong>Important:</strong> Only ONE academic year can be active at a time. The active year is used for new courses and enrollments.
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>Year</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="academicYear : ${academicYears}">
                    <td th:text="${academicYear.year}">2025</td>
                    <td>
                        <span th:if="${academicYear.active}" class="badge bg-success">
                            <i class="bi bi-check-circle"></i> Active
                        </span>
                        <span th:if="${!academicYear.active}" class="badge bg-secondary">
                            Inactive
                        </span>
                    </td>
                    <td>
                        <a th:href="@{/academic-years/{id}/edit(id=${academicYear.id})}"
                           class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i> Edit
                        </a>

                        <form th:if="${!academicYear.active}"
                              th:action="@{/academic-years/{id}/activate(id=${academicYear.id})}"
                              method="post"
                              style="display: inline;">
                            <button type="submit" class="btn btn-sm btn-success">
                                <i class="bi bi-power"></i> Activate
                            </button>
                        </form>

                        <a th:if="${!academicYear.active}"
                           th:href="@{/academic-years/{id}/delete(id=${academicYear.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure?')">
                            <i class="bi bi-trash"></i> Delete
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(academicYears)}">
                    <td colspan="3" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                        No academic years found. Create one to get started!
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
