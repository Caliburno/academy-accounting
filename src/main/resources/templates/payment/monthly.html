<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Monthly Payments - Academy Accounting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container mt-4">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1><i class="bi bi-cash-coin"></i> Monthly Payments</h1>
        <div>
            <a href="/payments" class="btn btn-primary"><i class="bi bi-calendar-check"></i> Current + Overdue</a>
            <a href="/payments/pending" class="btn btn-warning"><i class="bi bi-hourglass-split"></i> Pending</a>
            <a href="/payments/overdue" class="btn btn-danger"><i class="bi bi-exclamation-triangle"></i> Overdue</a>
            <a href="/payments/paid" class="btn btn-success"><i class="bi bi-check-circle"></i> Paid</a>
        </div>    </div>

    <div class="card">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>Student</th>
                    <th>Course</th>
                    <th>Month/Year</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Payment Date</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="payment : ${payments}">
                    <td th:text="${payment.enrollment.student.name}">John Doe</td>
                    <td th:text="${payment.enrollment.course.name}">English 101</td>
                    <td>
                        <span th:text="${payment.month + '/' + payment.year}">3/2025</span>
                    </td>
                    <td th:text="'$' + ${payment.amount}">$50</td>
                    <td>
                        <span th:if="${payment.status.name() == 'PAID'}" class="badge bg-success">
                            <i class="bi bi-check-circle"></i> Paid
                        </span>
                        <span th:if="${payment.status.name() == 'PENDING'}" class="badge bg-warning">
                            <i class="bi bi-hourglass-split"></i> Pending
                        </span>
                        <span th:if="${payment.status.name() == 'OVERDUE'}" class="badge bg-danger">
                            <i class="bi bi-exclamation-triangle"></i> Overdue
                        </span>
                    </td>
                    <td th:text="${payment.paymentDate != null ? #temporals.format(payment.paymentDate, 'dd/MM/yyyy') : '-'}">
                        15/03/2025
                    </td>
                    <td>
                        <form th:if="${payment.status.name() != 'PAID'}"
                              th:action="@{/payments/{id}/mark-paid(id=${payment.id})}"
                              method="post"
                              style="display: inline;">
                            <button type="submit" class="btn btn-sm btn-success"
                                    onclick="return confirm('Mark this payment as paid?')">
                                <i class="bi bi-check-circle"></i> Mark Paid
                            </button>
                        </form>
                        <span th:if="${payment.status.name() == 'PAID'}" class="text-success">
                            <i class="bi bi-check-circle-fill"></i> Completed
                        </span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(payments)}">
                    <td colspan="7" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                        No payments found
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
